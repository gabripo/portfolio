# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Daily rebuild: picks up LinkedIn posts that went live (scheduled posts) and edits in the posts repo
  schedule:
    - cron: '17 5 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.157.0
      # Read-only token for the private gabripo/linkedin-posts repository (optional: without it the site builds without posts)
      POSTS_REPO_TOKEN: ${{ secrets.POSTS_REPO_TOKEN }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Checkout LinkedIn posts (private)
        if: env.POSTS_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: gabripo/linkedin-posts
          token: ${{ env.POSTS_REPO_TOKEN }}
          path: _linkedin-posts
      - name: Export the public LinkedIn posts
        if: env.POSTS_REPO_TOKEN != ''
        run: |
          python3 -m pip install --quiet pyyaml
          # Only posts already public on LinkedIn: text to data/, images to assets/linkedin/
          python3 _linkedin-posts/scripts/export_for_portfolio.py data/linkedin_posts.json assets/linkedin
          rm -rf _linkedin-posts
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

