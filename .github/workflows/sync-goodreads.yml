name: Sync Goodreads Books

# Goodreads removed its RSS feeds. To add new books: Goodreads > My Books > Tools: Import and export >
# Export Library, then replace goodreads/goodreads_library_export.csv with the downloaded file.
on:
  push:
    branches: [main]
    paths: ['goodreads/goodreads_library_export.csv', 'scripts/fetch_goodreads_books.py']
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  actions: write # starts the site deploy after new books are committed

jobs:
  sync-books:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Run book sync script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_goodreads_books.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/book/ static/images/books/
          
          # Check if there are any changes staged
          if git diff --cached --quiet; then
            echo "No new books or covers to commit."
          else
            git commit -m "chore: auto-sync read books from Goodreads"
            git push origin main
            # A push made with the workflow's token does not start other workflows: deploy explicitly.
            gh workflow run hugo.yaml --ref main
          fi
