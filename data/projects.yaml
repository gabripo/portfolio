# Personal projects shown on /projects. Order = display order.
# agentic: true marks projects built through agentic coding (my ideas, AI-written code).
- name: "move_the_bot"
  tagline: "Tell a robot arm what to do: type it, say it, or show it with your hand"
  description: "\"Create an apple and a red cube, then put the apple on the cube.\" An agent turns the sentence into skills, MoveIt 2 plans collision-free motions and ros2_control executes them on an SO-101 arm. Your webcam can steer the gripper too: move your hand, pinch to grab. The arm is simulated by default; because every command goes through ros2_control, the same code drives NVIDIA Isaac Sim or the real arm by changing one launch argument. Runs locally in Docker, tested end to end on every change."
  tags: ["ROS 2", "MoveIt 2", "ros2_control", "NVIDIA Isaac Sim", "LLM agents", "Teleoperation"]
  repo: "https://github.com/gabripo/move_the_bot"
  image: "images/projects/move_the_bot.gif"
  agentic: true

- name: "The EKF Tuner"
  tagline: "A game about how robots know where they are"
  description: "Guide a warehouse robot (AGV) through a corridor where its sensors fail. Tune the sensor-fusion filter (Extended Kalman Filter) well, and it gets through; tune it badly, and it crashes. A cost calculator shows the hardware money good tuning saves."
  tags: ["Robotics", "Sensor fusion", "State estimation", "JavaScript"]
  repo: "https://github.com/gabripo/the_agv_game"
  demo: "https://gabripo.github.io/the_agv_game"
  image: "images/projects/agv.gif"

- name: "nvidia-shield-sword"
  tagline: "An old TV box turned into an always-on assistant"
  description: "Most of the time we own more hardware than we use. This turns an NVIDIA Shield into a home assistant I steer from Telegram: instant commands, my own scripts, and an AI agent for everything else, including searching flights and sending back screenshots."
  tags: ["Agentic AI", "Claude Code", "Telegram", "Linux"]
  repo: "https://github.com/gabripo/nvidia-shield-sword"
  image: "images/projects/shield.png"
  agentic: true

- name: "Forza!"
  tagline: "Helping aging parents get stronger and healthier"
  description: "A free app you set up for a parent or grandparent: beginner workouts, meals estimated from a photo, and progress explained in plain words. The family \"coach\" follows along and adjusts the plan."
  tags: ["Full-stack", "AI", "Health", "PWA"]
  repo: "https://github.com/gabripo/forza"
  image: "images/projects/forza.jpg"
  agentic: true

- name: "Brainstormer"
  tagline: "Brainstorm alone, with AI attendees at the table"
  description: "Runs a brainstorming session the Getting to Yes way: frame the situation, uncover interests, collect ideas without judging. AI attendees (Optimist, Skeptic, Customer, Engineer…) throw ideas from their own point of view, using Claude or a local Ollama model."
